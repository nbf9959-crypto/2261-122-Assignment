<!-- Generated by AI -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman Client</title>
  <style>
    :root {
      --bg1: #f2efe6;
      --bg2: #dfe8d2;
      --ink: #1f2a1f;
      --panel: #ffffffd8;
      --accent: #2e6f40;
      --accent-2: #8a5a2f;
      --danger: #ad2f2f;
      --ok: #246f3e;
      --muted: #5b665b;
      --shadow: 0 14px 28px rgba(18, 32, 21, 0.15);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, #ffffffa8 0%, #ffffff00 35%),
        radial-gradient(circle at 88% 90%, #b9d8b7aa 0%, #ffffff00 38%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(680px, 100%);
      background: var(--panel);
      border: 1px solid #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      animation: slideIn 420ms ease-out;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 2.6vw, 2rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .pill {
      border-radius: 999px;
      padding: 8px 12px;
      background: #eef3ea;
      border: 1px solid #d2ddcc;
      font-size: 0.9rem;
      text-align: center;
    }

    .hint {
      margin: 14px 0;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: 0.15em;
      font-weight: 700;
      word-wrap: break-word;
      min-height: 2.5rem;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"] {
      flex: 1 1 160px;
      font-size: 1.1rem;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #b4c2ae;
      outline: none;
      background: #fbfdf9;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #2e6f4022;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .guess-btn {
      background: var(--accent);
    }

    .reset-btn {
      background: #596b90;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f2f5ef;
      border: 1px solid #d7dfd2;
      min-height: 42px;
    }

    .status.error {
      color: var(--danger);
      border-color: #e8b3b3;
      background: #fff2f2;
    }

    .status.ok {
      color: var(--ok);
      border-color: #b8daba;
      background: #f2fff3;
    }

    .small {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 560px) {
      .hud {
        grid-template-columns: 1fr;
      }

      .row {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hangman</h1>
    <p class="subtitle">Client for your Java server on port 8081</p>

    <section class="hud">
      <div class="pill">State: <strong id="state">loading...</strong></div>
      <div class="pill">Guesses Left: <strong id="guesses-remaining">-</strong></div>
      <div class="pill">Server: <strong>http://localhost:8081</strong></div>
    </section>

    <section>
      <div id="hint" class="hint">_ _ _ _ _</div>
    </section>

    <section class="row">
      <input id="guess-input" type="text" maxlength="1" placeholder="Enter one letter" aria-label="Guess letter" />
      <button id="guess-btn" class="guess-btn">Guess</button>
      <button id="new-btn" class="reset-btn">New Session</button>
    </section>

    <div id="guesses" class="status">Guesses: <span id="guesses-list">—</span></div>
    <div id="guess-result" class="status">Last guess: none</div>
    <div id="message" class="status">Connecting to server...</div>
    <p class="small">Tip: start the server with HangmanServer first, then open this file in a browser.</p>
  </main>

  <script>
    const baseUrl = "http://localhost:8081";
    const stateEl = document.getElementById("state");
    const guessesRemainingEl = document.getElementById("guesses-remaining");
    const guessesEl = document.getElementById("guesses-list");
    const hintEl = document.getElementById("hint");
    const guessResultEl = document.getElementById("guess-result");
    const messageEl = document.getElementById("message");
    const guessInput = document.getElementById("guess-input");
    const guessBtn = document.getElementById("guess-btn");

    let sessionId = createSessionId();

    function createSessionId() {
      const rand = Math.random().toString(36).slice(2, 10);
      return "hangman-" + rand;
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.classList.remove("ok", "error");
      if (type) {
        messageEl.classList.add(type);
      }
    }

    function showGuessResult(text, type) {
      guessResultEl.textContent = "Last guess: " + text;
      guessResultEl.classList.remove("ok", "error");
      if (type) {
        guessResultEl.classList.add(type);
      }
    }

    function setGuessingEnabled(enabled) {
      guessInput.disabled = !enabled;
      guessBtn.disabled = !enabled;
    }

    function errorMessage(error) {
      if (error.message === "Failed to fetch") {
        return "Server not found or not responsive";
      }
      return error.message;
    }

    async function apiGet(path) {
      const response = await fetch(baseUrl + path, {
        method: "GET",
        headers: {
          "x-session-id": sessionId
        }
      });

      const text = await response.text();
      if (!response.ok) {
        throw new Error("GET " + path + " failed: " + response.status + " " + text);
      }
      return text;
    }

    async function sendGuess(letter) {
      const response = await fetch(baseUrl + "/guess", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8",
          "x-session-id": sessionId
        },
        body: letter
      });

      const text = await response.text();
      if (!response.ok) {
        throw new Error("POST /guess failed: " + response.status + " " + text);
      }
      return text;
    }

    async function refreshView() {
      try {
        const [state, hint, guessesRemaining, guesses] = await Promise.all([
          apiGet("/state"),
          apiGet("/hint"),
          apiGet("/guessesremaining"),
          apiGet("/guesses")
        ]);
        stateEl.textContent = state;
        hintEl.textContent = hint;
        guessesRemainingEl.textContent = guessesRemaining;
        guessesEl.textContent = guesses ? guesses.split('').join(' ') : "—";
        if (state === "WON") {
          setGuessingEnabled(false);
          showMessage("WON", "ok");
        } else if (state === "LOST") {
          setGuessingEnabled(false);
          showMessage("LOST", "error");
        } else {
          setGuessingEnabled(true);
          showMessage("Conncted", "ok");
        }
      } catch (error) {
        showMessage(errorMessage(error), "error");
      }
    }

    async function onGuess() {
      const letter = guessInput.value.trim().toLowerCase();
      if (!/^[a-z]$/.test(letter)) {
        showMessage("Enter exactly one letter (a-z).", "error");
        return;
      }

      try {
        const result = await sendGuess(letter);
        showGuessResult(result, "ok");
        guessInput.value = "";
        await refreshView();
      } catch (error) {
        showMessage(errorMessage(error), "error");
      }
    }

    document.getElementById("guess-btn").addEventListener("click", onGuess);
    document.getElementById("new-btn").addEventListener("click", () => {
      sessionId = createSessionId();
      showGuessResult("none", null);
      setGuessingEnabled(true);
      guessInput.value = "";
      refreshView();
    });

    guessInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        onGuess();
      }
    });

    refreshView();
  </script>
</body>
</html>
